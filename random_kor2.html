<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리나라 행정구역 랜덤뽑기</title>
<style>
  :root{
    --navy:#143A73; --blue:#2C6BD6; --blue-soft:#dbe7fb;
    --green:#1FA84C; --green-d:#177c39;
    --coral:#EC4646; --coral-d:#c22f2f;
    --amber:#FFB02E; --amber-glow:#FFD45E;
    --ink:#1d2533; --mut:#6b7790;
    --surface:#ffffff; --line:#e3e9f4;
    --bg1:#eef3fb; --bg2:#e0eaf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, #fff 0%, rgba(255,255,255,0) 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 34px;
  }
  .wrap{width:100%; max-width:660px}

  /* ---- top bar ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
  .brand{display:flex; align-items:center; gap:10px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--navy));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 6px 14px rgba(20,58,115,.28)}
  .brand h1{font-size:17px;margin:0;letter-spacing:-.02em;font-weight:800}
  .brand p{margin:1px 0 0;font-size:11.5px;color:var(--mut);font-weight:600}

  .steps{display:flex;align-items:center;gap:7px}
  .pill{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:5px 7px;box-shadow:0 2px 8px rgba(20,40,90,.05)}
  .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;
    background:#eef2f9;color:var(--mut);transition:.3s}
  .dot.on{background:var(--blue);color:#fff;box-shadow:0 4px 10px rgba(44,107,214,.4)}
  .pill .lbl{font-size:11.5px;font-weight:700;color:var(--mut);padding-right:5px}
  .seg{width:16px;height:2px;border-radius:2px;background:#dce3ef}

  /* ---- card ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;
    box-shadow:0 18px 44px rgba(22,44,92,.10);overflow:hidden}
  .screen{display:none}
  .screen.active{display:block}

  /* stage header strip */
  .shead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(90deg,#f7faff,#fff)}
  .shead .tag{font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--navy);
    padding:4px 9px;border-radius:7px}
  .shead h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em}
  .shead .sub{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600}

  /* ---- map ---- */
  .mapbox{position:relative;display:block;width:100%;background:#fbfcfe}
  .mapbox img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  .mapwrap{position:relative;width:100%;max-width:560px;margin:10px auto 4px}
  .mapwrap.wide{max-width:640px}

  /* province lights */
  .light{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
  .light .core{width:13px;height:13px;border-radius:50%;background:#c9d4e8;
    box-shadow:0 0 0 2px rgba(255,255,255,.9);transition:.12s}
  .light .ring{position:absolute;inset:50% auto auto 50%;width:13px;height:13px;border-radius:50%;
    transform:translate(-50%,-50%);opacity:0}
  .light.on .core{width:22px;height:22px;background:radial-gradient(circle at 35% 30%,var(--amber-glow),var(--amber));
    box-shadow:0 0 0 4px rgba(255,176,46,.28), 0 0 22px 6px rgba(255,176,46,.65)}
  .light.win .core{width:24px;height:24px;background:radial-gradient(circle at 35% 30%,#ffe79a,var(--coral));
    box-shadow:0 0 0 5px rgba(236,70,70,.25), 0 0 26px 8px rgba(236,70,70,.55);animation:beat 1s ease-in-out infinite}
  .light.win .ring{opacity:1;width:24px;height:24px;border:3px solid var(--coral);animation:halo 1.3s ease-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  @keyframes halo{0%{width:24px;height:24px;opacity:.8}100%{width:74px;height:74px;opacity:0}}

  /* result badge floating over map */
  .badge{position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-8px) scale(.9);
    background:var(--navy);color:#fff;padding:11px 20px;border-radius:14px;font-weight:800;font-size:20px;
    letter-spacing:-.02em;box-shadow:0 12px 28px rgba(20,40,90,.35);opacity:0;transition:.35s cubic-bezier(.2,1.2,.3,1);
    z-index:5;white-space:nowrap;display:flex;align-items:center;gap:9px}
  .badge.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .badge .star{font-size:18px}
  .badge .reg{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:8px}

  /* ---- controls ---- */
  .controls{padding:14px 18px 18px;border-top:1px solid var(--line);background:linear-gradient(0deg,#f8fbff,#fff)}
  .status{text-align:center;font-size:13.5px;font-weight:700;color:var(--mut);min-height:20px;margin-bottom:11px}
  .status b{color:var(--blue)}
  .btnrow{display:flex;gap:10px}
  .btn{flex:1;border:0;border-radius:16px;padding:17px 14px;font-family:inherit;font-size:18px;font-weight:800;
    letter-spacing:-.01em;cursor:pointer;color:#fff;transition:transform .08s, box-shadow .2s, opacity .2s;
    display:flex;align-items:center;justify-content:center;gap:9px}
  .btn:active{transform:translateY(2px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn .ic{font-size:19px}
  .btn-start{background:linear-gradient(180deg,#27c258,var(--green));box-shadow:0 8px 18px rgba(31,168,76,.4)}
  .btn-stop{background:linear-gradient(180deg,#ff5b5b,var(--coral));box-shadow:0 8px 18px rgba(236,70,70,.42)}
  .btn-stop.live{animation:wig .9s ease-in-out infinite}
  @keyframes wig{0%,100%{box-shadow:0 8px 18px rgba(236,70,70,.42)}50%{box-shadow:0 8px 26px rgba(236,70,70,.7)}}
  .btn-next{background:linear-gradient(180deg,#3d82ea,var(--blue));box-shadow:0 8px 18px rgba(44,107,214,.42)}
  .btn-ghost{background:#eef2f9;color:var(--navy);box-shadow:none}
  .hide{display:none !important}

  /* stage 2 */
  .s2head{padding:16px 18px;border-bottom:1px solid var(--line);text-align:center;
    background:linear-gradient(90deg,#f3f8ff,#fff)}
  .s2head .from{font-size:13px;color:var(--mut);font-weight:700}
  .s2head .from b{color:var(--blue);font-size:15px}
  .s2head .arrow{margin:6px 0 4px;color:#c4cee0;font-size:18px}
  .s2head .reg{font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--navy)}
  .s2head .reg .em{color:var(--coral)}
  .note{margin:10px 18px 0;padding:11px 14px;border:1px dashed var(--blue-soft);border-radius:12px;
    background:#f6f9ff;color:var(--mut);font-size:12.5px;font-weight:600;text-align:center}
  .note b{color:var(--blue)}

  .hint{text-align:center;font-size:11.5px;color:#9aa6bd;margin-top:14px;font-weight:600}
  kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;
    font-family:inherit;font-size:11px;font-weight:700;color:var(--mut)}

  @media (max-width:560px){
    .brand h1{font-size:15px}.pill .lbl{display:none}
    .badge{font-size:17px;padding:9px 15px}.s2head .reg{font-size:22px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">韓</div>
      <div><h1>우리나라 행정구역 랜덤뽑기</h1><p>시작 버튼을 누르고, 멈춤 버튼으로 뽑아요</p></div>
    </div>
    <div class="steps">
      <div class="pill">
        <span class="dot on" id="d1">1</span>
        <span class="lbl">시·도 뽑기</span>
        <span class="seg"></span>
        <span class="dot" id="d2">2</span>
        <span class="lbl">지방 지도</span>
      </div>
    </div>
  </div>

  <!-- ===== STAGE 1 ===== -->
  <section class="screen active card" id="screen1">
    <div class="shead">
      <span class="tag">1단계</span>
      <h2>남한 전도에서 시·도 뽑기</h2>
      <span class="sub">도 단위</span>
    </div>
    <div class="mapbox">
      <div class="mapwrap" id="mapwrap1">
        <div class="badge" id="badge"><span class="star">🎉</span><span id="badgeName">—</span><span class="reg" id="badgeReg"></span></div>
        <img id="img1" alt="남한 전도(도 단위)">
        <!-- lights injected by JS -->
      </div>
    </div>
    <div class="controls">
      <div class="status" id="status1">시작 버튼을 누르면 시·도에 불이 번쩍번쩍 들어와요!</div>
      <div class="btnrow" id="row1">
        <button class="btn btn-start" id="startBtn"><span class="ic">▶</span>시작</button>
        <button class="btn btn-stop hide" id="stopBtn"><span class="ic">⏸</span>멈춤</button>
      </div>
      <div class="btnrow hide" id="row1b" style="margin-top:10px">
        <button class="btn btn-ghost" id="retryBtn">↻ 다시 뽑기</button>
        <button class="btn btn-next" id="nextBtn">다음 단계로 →</button>
      </div>
    </div>
  </section>

  <!-- ===== STAGE 2 ===== -->
  <section class="screen card" id="screen2">
    <div class="s2head">
      <div class="from">뽑은 시·도 &nbsp;<b id="pickedName">—</b></div>
      <div class="arrow">▼</div>
      <div class="reg"><span id="regName" class="em">—</span> 지방</div>
    </div>
    <div class="mapbox">
      <div class="mapwrap wide" id="mapwrap2">
        <img id="img2" alt="지방 지도">
      </div>
    </div>
    <div class="note">다음 단계에서는 이 지도에서 <b>멋진 산과 바다 지형</b>을 뽑을 예정이에요. (곧 추가됩니다)</div>
    <div class="controls">
      <div class="btnrow">
        <button class="btn btn-ghost" id="backBtn">← 1단계로</button>
        <button class="btn btn-start" id="againBtn">↻ 처음부터 다시</button>
      </div>
    </div>
  </section>

  <p class="hint">단축키 &nbsp;<kbd>Space</kbd> 시작 · 멈춤 &nbsp;|&nbsp; <kbd>Enter</kbd> 다음</p>
</div>

// running-light loop order (geographic ring)
const order=[3,8,9,12,13,11,15,16,14,10,6,7,5,4,2,1,0];

const wrap1=document.getElementById('mapwrap1');
const lights=provinces.map((p,i)=>{
  const el=document.createElement('div');
  el.className='light'; el.style.left=p.x+'%'; el.style.top=p.y+'%';
  el.innerHTML='<div class="ring"></div><div class="core"></div>';
  wrap1.appendChild(el); return el;
});

const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
const row1b=document.getElementById('row1b');
const nextBtn=document.getElementById('nextBtn');
const retryBtn=document.getElementById('retryBtn');
const status1=document.getElementById('status1');
const badge=document.getElementById('badge');
const badgeName=document.getElementById('badgeName');
const badgeReg=document.getElementById('badgeReg');

let running=false, timer=null, pos=0, picked=null;

function clearLights(){lights.forEach(l=>l.className='light');}
function lightAt(i){clearLights(); lights[i].classList.add('on');}

function resetStage1(){
  running=false; clearTimeout(timer); clearLights();
  badge.classList.remove('show');
  picked=null;
  startBtn.classList.remove('hide'); startBtn.disabled=false;
  stopBtn.classList.add('hide'); stopBtn.classList.remove('live');
  row1b.classList.add('hide');
  status1.innerHTML="시작 버튼을 누르면 시·도에 불이 번쩍번쩍 들어와요!";
}

function startGame(){
  if(running) return;
  badge.classList.remove('show'); row1b.classList.add('hide'); clearLights();
  running=true;
  startBtn.classList.add('hide');
  stopBtn.classList.remove('hide'); stopBtn.classList.add('live'); stopBtn.disabled=false;
  status1.innerHTML="불빛이 돌고 있어요… <b>멈춤</b>을 눌러 뽑으세요!";
  pos=Math.floor(Math.random()*order.length);
  (function run(){
    if(!running) return;
    lightAt(order[pos]);
    pos=(pos+1)%order.length;
    timer=setTimeout(run,70);
  })();
}

function stopGame(){
  if(!running) return;
  running=false; clearTimeout(timer);
  stopBtn.classList.remove('live'); stopBtn.disabled=true;
  const target=Math.floor(Math.random()*provinces.length);
  const tpos=order.indexOf(target);
  const loops=1;
  const total=loops*order.length+((tpos-pos+order.length)%order.length);
  let done=0;
  (function step(){
    lightAt(order[pos]);
    if(done>=total){ land(target); return; }
    pos=(pos+1)%order.length; done++;
    const frac=done/total;
    const interval=65+(320-65)*Math.pow(frac,1.8);
    timer=setTimeout(step,interval);
  })();
}

function land(i){
  picked=provinces[i];
  clearLights(); lights[i].classList.add('win');
  badgeName.textContent=picked.f;
  badgeReg.textContent=picked.r+" 지방";
  badge.classList.add('show');
  status1.innerHTML="<b>"+picked.f+"</b> 당첨! 🎉";
  stopBtn.classList.add('hide');
  row1b.classList.remove('hide');
}

function goStage2(){
  if(!picked) return;
  document.getElementById('pickedName').textContent=picked.f;
  const reg=document.getElementById('regName');
  reg.textContent=picked.r;
  document.getElementById('img2').src=(picked.r==="중부")?IMG_MID:IMG_SOUTH;
  document.getElementById('mapwrap2').className='mapwrap wide';
  document.getElementById('screen1').classList.remove('active');
  document.getElementById('screen2').classList.add('active');
  document.getElementById('d1').classList.remove('on');
  document.getElementById('d2').classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}
function goStage1(keep){
  document.getElementById('screen2').classList.remove('active');
  document.getElementById('screen1').classList.add('active');
  document.getElementById('d2').classList.remove('on');
  document.getElementById('d1').classList.add('on');
  if(!keep) resetStage1();
}

startBtn.onclick=startGame;
stopBtn.onclick=stopGame;
retryBtn.onclick=resetStage1;
nextBtn.onclick=goStage2;
document.getElementById('backBtn').onclick=()=>goStage1(true);
document.getElementById('againBtn').onclick=()=>goStage1(false);

document.addEventListener('keydown',(e)=>{
  const s1=document.getElementById('screen1').classList.contains('active');
  if(e.code==='Space'){
    e.preventDefault();
    if(s1){ if(running) stopGame(); else if(!picked) startGame(); }
  }
  if(e.code==='Enter'){
    e.preventDefault();
    if(s1 && picked) goStage2();
  }
});

resetStage1();
</script>
