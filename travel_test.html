<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 여행 DNA는? | 여행 취향 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
/* ===================== 토큰 : 선명 + 진한 컬러 ===================== */
:root{
  --bg:#FFF3D9;            /* 크림 배경 (v2보다 진하게) */
  --card:#FFFFFF;
  --ink:#26293D;           /* 텍스트 */
  --sub:#5A5F78;
  --stroke:#26293D;        /* 굵은 외곽선 (귀여운 스티커 느낌) */
  --line:#E7C489;
  --brand:#FF6B2C;         /* 비비드 오렌지 */
  --brand-d:#E14E10;
  --yellow:#FFB703;
  --blue:#1B62D8;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
}
.wrap{max-width:1120px;margin:0 auto;padding:14px 20px 36px;}

/* ===================== 애니메이션 / 캡처 대응 ===================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .3s ease both;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 2.4s ease-in-out infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{animation:spin 1.3s linear infinite;transform-origin:50% 50%;}
/* ★ 캡처 시 애니메이션 전면 무력화 → 흐릿하게 찍히는 문제 해결(유지) */
html.capture-mode *,html.capture-mode *::before,html.capture-mode *::after{
  animation:none !important; transition:none !important; opacity:1 !important; transform:none !important;
}
html.capture-mode .no-capture{display:none !important;}

/* ===================== 공통 버튼 ===================== */
.btn{
  border:2.5px solid var(--stroke); background:#fff; color:var(--ink);
  font-family:inherit; font-weight:800; font-size:15px; padding:12px 22px;
  border-radius:14px; cursor:pointer; box-shadow:3px 3px 0 var(--stroke);
  transition:transform .12s, box-shadow .12s, background .12s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--stroke);background:#FFF6E4;}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stroke);}
.btn.fill{background:var(--brand);color:#fff;}
.btn.fill:hover{background:var(--brand-d);}
.btn.cta{background:var(--blue);color:#fff;font-size:17px;padding:16px 30px;}
.btn.cta:hover{background:#134FB0;}
.btn.ghost{background:#FFE7BF;}
.btn-primary{
  border:3px solid var(--stroke); background:var(--brand); color:#fff;
  font-weight:900; font-size:19px; padding:16px 44px; border-radius:16px; cursor:pointer;
  font-family:inherit; box-shadow:4px 4px 0 var(--stroke); transition:transform .12s, box-shadow .12s, background .12s;
}
.btn-primary:hover{background:var(--brand-d);transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--stroke);}
.btn-primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--stroke);}

/* ===================== 상단 바 ===================== */
.topbar{display:flex;align-items:center;gap:12px;padding:6px 0 14px;}
.backbtn{
  width:42px;height:42px;flex:none;border:2.5px solid var(--stroke);background:#fff;border-radius:13px;
  font-size:19px;font-weight:900;color:var(--ink);cursor:pointer;line-height:1;box-shadow:3px 3px 0 var(--stroke);
}
.backbtn:hover{background:#FFE7BF;}
.backbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stroke);}
.progress-outer{flex:1;height:16px;background:#fff;border:2.5px solid var(--stroke);border-radius:99px;overflow:hidden;}
.progress-inner{height:100%;width:0%;background:var(--brand);transition:width .3s ease;}
.progress-text{font-size:14px;font-weight:900;color:var(--ink);min-width:48px;text-align:right;}

/* ===================== 인트로 ===================== */
.intro{text-align:center;padding:10px 0 6px;}
.intro h1{font-size:40px;font-weight:900;margin:8px 0 6px;letter-spacing:-1.4px;}
.intro p{color:var(--sub);font-size:16px;margin:0 0 4px;font-weight:600;}
.badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 20px;}
.mini-badge{font-size:13px;font-weight:800;padding:6px 12px;border-radius:9px;background:#FFD98A;color:#7A4A05;border:2px solid var(--stroke);}

/* ===================== 문항 (크롬북 16:9 대응) ===================== */
.quiz-stage{
  display:flex;flex-direction:column;justify-content:center;
  min-height:calc(100vh - 150px);
}
.q-head{text-align:center;margin-bottom:16px;}
.q-emoji{
  width:74px;height:74px;margin:0 auto 8px;border-radius:50%;
  background:#FFD98A;border:3px solid var(--stroke);box-shadow:3px 3px 0 var(--stroke);
  display:flex;align-items:center;justify-content:center;font-size:36px;line-height:1;
}
.q-num{display:inline-block;font-size:13px;font-weight:900;color:#fff;background:var(--brand);
  border:2px solid var(--stroke);border-radius:8px;padding:2px 10px;letter-spacing:.5px;}
.q-title{font-size:27px;font-weight:900;margin:8px 0 0;letter-spacing:-.8px;}
.opts{display:grid;gap:12px;max-width:900px;margin:0 auto;width:100%;}
.opts.two{grid-template-columns:1fr 1fr;}
.opts.four{grid-template-columns:1fr 1fr;}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;
  border:2.5px solid var(--stroke);background:#fff;border-radius:16px;
  padding:14px 16px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
  box-shadow:3px 3px 0 var(--stroke); transition:transform .12s, box-shadow .12s, background .12s;
}
.opt:hover{background:#FFF1D2;transform:translate(-1px,-2px);box-shadow:5px 6px 0 var(--stroke);}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stroke);}
.opt .ico{font-size:28px;flex:none;line-height:1;width:34px;text-align:center;}
.opt .ico svg{display:block;width:34px;height:34px;}
.opt .tag{margin-left:auto;font-size:11px;font-weight:900;color:#7A4A05;background:#FFD98A;
  border:2px solid var(--stroke);border-radius:7px;padding:2px 7px;flex:none;}

/* ===================== 로딩 ===================== */
.loading{text-align:center;padding:70px 0;}
.loading p{font-size:22px;font-weight:900;margin-top:16px;}
.loading small{color:var(--sub);font-weight:600;}

/* ===================== 결과 ===================== */
.result-head{text-align:center;padding:6px 0 18px;}
.type-badge{display:inline-block;font-size:13px;font-weight:900;padding:5px 13px;border-radius:9px;color:#fff;border:2px solid var(--stroke);}
.type-name{font-size:42px;font-weight:900;margin:12px 0 4px;letter-spacing:-1.6px;}
.type-sub{color:var(--sub);font-size:15px;margin:0;font-weight:700;}
.card{background:var(--card);border:2.5px solid var(--stroke);border-radius:var(--radius);padding:18px 20px;box-shadow:4px 4px 0 rgba(38,41,61,.16);}
.card h3{font-size:17px;font-weight:900;margin:0 0 9px;display:flex;align-items:center;gap:7px;}
.card p{margin:0;font-size:15px;color:#3B3F55;font-weight:500;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
.tips li{display:flex;gap:9px;font-size:15px;color:#2F3348;background:#FFF3D9;border:2px solid #E7C489;border-radius:11px;padding:10px 13px;font-weight:600;}
.tips li b{color:#0F8C46;flex:none;font-weight:900;}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.region{border:2.5px solid var(--stroke);border-radius:14px;padding:13px 15px;background:#fff;display:flex;gap:12px;box-shadow:3px 3px 0 rgba(38,41,61,.14);}
.region .no{font-size:12px;font-weight:900;color:#fff;border:2px solid var(--stroke);border-radius:7px;padding:1px 7px;height:24px;flex:none;}
.region .nm{font-size:16px;font-weight:900;margin:0 0 3px;}
.region .ft{font-size:14px;color:#3B3F55;margin:0;font-weight:500;}

/* ===================== 하단 버튼 / 결과 하단 왼쪽 뒤로가기 ===================== */
.footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 4px;}
.footer .right{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 4px;}
.hint{text-align:center;color:var(--sub);font-size:13px;margin-top:10px;font-weight:600;}

/* ===================== 전체 유형 ===================== */
.all-type{border:2.5px solid var(--stroke);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;background:#fff;box-shadow:4px 4px 0 rgba(38,41,61,.16);}
.all-type .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.all-type .hd h3{font-size:24px;font-weight:900;margin:0;letter-spacing:-1px;}
.all-type .meta{font-size:14px;color:#3B3F55;margin:2px 0 12px;font-weight:600;}
.hidden{display:none !important;}

/* ===================== 크롬북(1366×768) 최적화 ===================== */
@media (max-height:820px){
  .quiz-stage{min-height:calc(100vh - 120px);}
  .q-emoji{width:62px;height:62px;font-size:30px;margin-bottom:6px;}
  .q-title{font-size:24px;}
  .q-head{margin-bottom:12px;}
  .opt{padding:12px 15px;font-size:15px;}
  .opt .ico,.opt .ico svg{font-size:25px;width:30px;height:30px;}
  .opts{gap:10px;}
  .intro h1{font-size:34px;}
  .intro svg.hero{height:150px;}
}
@media (max-width:900px){
  .grid2,.regions,.opts.two,.opts.four{grid-template-columns:1fr;}
  .type-name{font-size:31px;} .intro h1{font-size:29px;}
}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ 상단 바 (문항 전용) ============ -->
<div class="topbar no-capture" id="topbar" style="display:none">
  <button class="backbtn" id="backBtn" onclick="goBack()">&#8592;</button>

</div>

<!-- ============ 화면 1 : 인트로 (이전 버전 일러스트 복원 + 진한 색) ============ -->
<section id="screen-intro" class="fade">

    <div class="badge-row">

<!-- ============ 화면 2~7 : 문항 ============ -->
<section id="screen-quiz" class="hidden">
  <div class="quiz-stage" id="qBody"></div>
</section>

<!-- ============ 로딩 ============ -->
<section id="screen-loading" class="hidden">
  <div class="loading">
    <svg width="130" height="130" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="47" fill="#FFD98A" stroke="#26293D" stroke-width="4"/>

</section>

<!-- ============ 결과 1 ============ -->
<section id="screen-r1" class="hidden">
  <div id="r1Body"></div>
  <div class="footer no-capture">
    <button class="btn ghost" onclick="resBack('r1')">&#8592; 뒤로</button>
    <div class="right">
      <button class="btn fill" onclick="show('r2')">다음 페이지 &#8594;</button>

<!-- ============ 결과 2 ============ -->
<section id="screen-r2" class="hidden">

    <div class="right">
      <button class="btn fill" onclick="show('r3')">다음 페이지 &#8594;</button>
      <button class="btn" onclick="capture('screen-r2','result2')">화면 캡처</button>
      <button class="btn" onclick="restart()">재시작</button>
    </div>
  </div>
</section>

<!-- ============ 결과 3 ============ -->
<section id="screen-r3" class="hidden">
  <div id="r3Body"></div>
  <div class="btnrow no-capture">
    <button class="btn cta" onclick="show('r4')">모든 유형별 추천 여행지 보기</button>

  <div class="footer no-capture">
    <button class="btn ghost" onclick="resBack('r3')">&#8592; 뒤로</button>

</section>

<!-- ============ 결과 4 : 전체 유형 ============ -->

<script>
/* =========================================================
   1. 유형 데이터 (내용 변경 없음 / 색상만 진하게 조정)
   ========================================================= */
const TYPES = {
  time:{

    regions:[

      ["공주","금강을 방어선으로 삼은 공산성과 웅진 백제 문화"],

      ["군산","일제강점기 호남평야의 미곡 수탈을 위해 개발된 항구 지형과 근대 문화유산"],
      ["서울","배산임수 명당의 정석인 한양도성과 5대 궁궐 탐방"],

  },
  active:{
    name:"가만히 못있는 병", cat:"하이킹/트레킹", color:"#DF2E12", tint:"#FFD5C9", art:"mountain",

/* =========================================================
   5. 상태 & 화면 전환
   ========================================================= */
let qIdx = 0, answers = [], resultKey = null, planTag = "";
const SC = {intro:"screen-intro", quiz:"screen-quiz", loading:"screen-loading",
            r1:"screen-r1", r2:"screen-r2", r3:"screen-r3", r4:"screen-r4"};
let current = "intro";

function show(key){
  Object.values(SC).forEach(id=>document.getElementById(id).classList.add("hidden"));
  const el = document.getElementById(SC[key]);
  el.classList.remove("hidden");
  el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
  document.getElementById("topbar").style.display = (key==="quiz") ? "flex" : "none";
  current = key;
  window.scrollTo({top:0, behavior:"instant"});
  save();
}
function startQuiz(){ qIdx=0; answers=[]; show("quiz"); renderQ(); }

function renderQ(){
  const Q = QUESTIONS[qIdx];
  document.getElementById("progBar").style.width = ((qIdx+1)/QUESTIONS.length*100)+"%";
  document.getElementById("progText").textContent = (qIdx+1)+" / "+QUESTIONS.length;
  let h = '<div class="fade"><div class="q-head">'+
          '<div class="q-emoji">'+Q.qico+'</div>'+
          '<span class="q-num">QUESTION '+(qIdx+1)+'</span>'+
          '<h2 class="q-title">'+Q.qico+' '+Q.q+'</h2></div>'+
          '<div class="opts '+Q.cols+'">';
  Q.opts.forEach((o,i)=>{
    h += '<button class="opt" onclick="pick('+i+')"><span class="ico">'+o.ico+'</span><span>'+o.t+'</span>'+
         (o.tag?'<span class="tag">'+o.tag+'</span>':'')+'</button>';
  });
  document.getElementById("qBody").innerHTML = h + '</div></div>';
}
function pick(i){
  answers[qIdx] = i;
  if(qIdx === 0) planTag = QUESTIONS[0].opts[i].tag;
  if(qIdx < QUESTIONS.length-1){ qIdx++; renderQ(); }
  else { show("loading"); setTimeout(()=>{ calc(); buildResults(); show("r1"); }, 1800); }
}
function goBack(){
  if(current!=="quiz"){ show("intro"); return; }
  if(qIdx===0){ show("intro"); } else { qIdx--; renderQ(); }
}
/* ★ 결과 화면 전용 뒤로가기 : 결과를 다시 계산하지 않고 페이지만 이동 → 결과 변경/오류 없음 */
function resBack(from){
  if(from==="r4"){ show("r3"); return; }
  if(from==="r3"){ show("r2"); return; }
  if(from==="r2"){ show("r1"); return; }
  /* r1에서는 더 앞(문항)으로 가면 결과가 바뀔 수 있으므로 확인 후 처음 화면으로 */
  if(confirm("첫 화면으로 돌아가면 테스트를 다시 진행해야 합니다. 이동할까요?")) restart();
}
function calc(){
  const sc = {time:0,active:0,heal:0,photo:0,food:0,eco:0};
  answers.forEach((ai,qi)=>{ const s = QUESTIONS[qi].opts[ai].s; for(const k in s) sc[k]+=s[k]; });
  resultKey = ORDER.reduce((a,b)=> sc[b] > sc[a] ? b : a, ORDER[0]);
}

/* =========================================================

}

/* =========================================================
   7. 화면 캡처 (선명도 수정 로직 유지)
   ========================================================= */
async function capture(elId, label){
  if(typeof html2canvas === "undefined"){
    alert("캡처 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); return;
  }
  const el = document.getElementById(elId);
  const name = "여행DNA_" + (resultKey ? TYPES[resultKey].name : "결과") + "_" + label + ".png";
  document.documentElement.classList.add("capture-mode");
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const canvas = await html2canvas(el, {
      backgroundColor:"#FFF3D9",
      scale:2, useCORS:true, logging:false,
      width: el.scrollWidth, height: el.scrollHeight,
      windowWidth: document.documentElement.clientWidth,
      windowHeight: el.scrollHeight + 200,
      scrollX:0, scrollY:0,
      onclone:(doc)=>{
        doc.documentElement.classList.add("capture-mode");
        doc.querySelectorAll("*").forEach(n=>{
          n.style.animation = "none";
          n.style.transition = "none";
          n.style.opacity = "1";
        });
        doc.querySelectorAll(".no-capture").forEach(n=>n.remove());
      }
    });
    const a = document.createElement("a");
    a.download = name;
    a.href = canvas.toDataURL("image/png");
    a.click();
  }catch(e){
    alert("캡처에 실패했습니다: " + e.message);
  }finally{
    document.documentElement.classList.remove("capture-mode");
  }
}

/* =========================================================
   8. 재시작 / 진행 상태 저장
   ========================================================= */
function restart(){ localStorage.removeItem("travelDNA"); qIdx=0; answers=[]; resultKey=null; planTag=""; show("intro"); }
function save(){
  try{ localStorage.setItem("travelDNA", JSON.stringify({qIdx, answers, resultKey, planTag, current})); }catch(e){}
}
(function load(){
  try{
    const d = JSON.parse(localStorage.getItem("travelDNA")||"null");
    if(!d) return;
    qIdx=d.qIdx||0; answers=d.answers||[]; resultKey=d.resultKey; planTag=d.planTag||"";
    if(d.current==="quiz"){ show("quiz"); renderQ(); }
    else if(["r1","r2","r3","r4"].includes(d.current) && resultKey){ buildResults(); show(d.current); }
  }catch(e){}
})();
</script>
